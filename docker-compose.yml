services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: azlan
      POSTGRES_USER: azlan
      POSTGRES_PASSWORD: azlan_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azlan -d azlan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://azlan:azlan_dev_only@postgres:5432/azlan
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: python -m worker.main
    environment:
      DATABASE_URL: postgresql+asyncpg://azlan:azlan_dev_only@postgres:5432/azlan
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
